name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build DoubleClickFix/DoubleClickFix.csproj --no-restore --configuration Release --property:SkipWapProjects=true
      shell: pwsh

    - name: Run tests
      run: dotnet test DoubleClickFix.Tests/DoubleClickFix.Tests.csproj --no-restore --configuration Release
      shell: pwsh

    - name: Package binaries
      run: |
        mkdir Release
        Copy-Item -Path DoubleClickFix/bin/Release/net10.0-windows10.0.17763.0/* -Destination Release/ -Recurse
        Copy-Item -Path update.bat -Destination Release/
        Copy-Item -Path uninstall.bat -Destination Release/
      shell: pwsh

    - name: Upload unsigned artifact
      id: upload-unsigned-artifact
      uses: actions/upload-artifact@v4
      with:
        name: DoubleClickFix-unsigned
        path: Release/
        if-no-files-found: error

    - name: Sign with SignPath
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: DoubleClickFix
        signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
        artifact-configuration-slug: standalone-zip
        github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: Release-signed

    - name: Create ZIP file
      run: Compress-Archive -Path Release-signed/* -DestinationPath DoubleClickFix.zip
      shell: pwsh

    - name: Upload signed ZIP
      uses: actions/upload-artifact@v4
      with:
        name: DoubleClickFix-signed
        path: DoubleClickFix.zip
        if-no-files-found: error

    - name: Create Release and upload assets
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        body: |
          Release notes
          *Installation*: Download the binaries, extract the DoubleClickFix.zip file and launch DoubleClickFix.exe.
          This will launch a Windows tray icon. Double-click it to open the UI and fine-tune the settings.
          Windows only. Requires .NET 10 run-time.
          *Update*: Run `update.bat` from the extracted zip — it finds the running application, copies the new files, and restarts it.
          Alternatively, exit the application manually (right-click the tray icon), copy the files, and restart.
          If you start the updated application from a different directory, you have to unregister and re-register
          the app to launch at Windows startup.
          *Uninstall*: Run `uninstall.bat` from the extracted zip — it stops the app, removes the startup entry,
          and deletes its registry settings and crash log.
        draft: false
        prerelease: false
        files: ./DoubleClickFix.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
