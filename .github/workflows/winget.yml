name: Publish to winget-pkgs

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # vedantmgoyal9/winget-releaser, pinned to main@2026-08-09 (no maintained version tag exists)
      - uses: vedantmgoyal9/winget-releaser@b3a5dae0047c6180023acba3f548c55fdf6b7193
        with:
          identifier: nenning.DoubleClickFix
          installers-regex: 'DoubleClickFix\.zip$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
