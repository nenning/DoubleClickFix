# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # Implicit runtime packs pulled in by <RuntimeIdentifiers> + PublishReadyToRun.
      # No PackageReference exists for these, so Dependabot can't open a fix PR anyway —
      # their version tracks whatever .NET SDK performs the restore, and the app is
      # framework-dependent (not self-contained), so they never ship to users.
      # See "Technical Notes" in readme.md for how to revert this if that changes.
      - dependency-name: "Microsoft.NETCore.App.Runtime.win-x64"
      - dependency-name: "Microsoft.NETCore.App.Runtime.win-x86"
      - dependency-name: "Microsoft.NETCore.App.Runtime.win-arm64"
      - dependency-name: "Microsoft.WindowsDesktop.App.Runtime.win-x64"
      - dependency-name: "Microsoft.WindowsDesktop.App.Runtime.win-x86"
      - dependency-name: "Microsoft.WindowsDesktop.App.Runtime.win-arm64"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
